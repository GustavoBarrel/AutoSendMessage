{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoSendMessage</title>
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <header class="login-header">
                <h1>AutoSendMessage</h1>
                <p class="subtitulo">Acesso restrito à plataforma</p>
            </header>
            <form method="post" action="{% url 'accounts:login' %}" class="login-form">
                {% csrf_token %}
                {% if form.errors %}
                <p class="msg-erro">Usuário ou senha incorretos. Tente novamente.</p>
                {% endif %}
                <div class="form-group">
                    <label for="id_username">Usuário</label>
                    <input type="text" name="username" id="id_username" required autofocus autocomplete="username" placeholder="Digite seu usuário">
                </div>
                <div class="form-group">
                    <label for="id_password">Senha</label>
                    <input type="password" name="password" id="id_password" required autocomplete="current-password" placeholder="Digite sua senha">
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn-entrar">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
